name: Windows app

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win nsis portable
      - uses: actions/upload-artifact@v4
        with:
          name: Maomao-windows
          path: |
            dist/Maomao-Setup.exe
            dist/Maomao-Portable.exe
      # One page with the newest installer: github.com/<you>/deskpet/releases/latest
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Maomao for Windows
          make_latest: true
          body: |
            **Maomao-Setup.exe**: install it (no admin needed). Maomao appears and opens Settings the first time. Paste a Claude API key there to chat with her.
            **Maomao-Portable.exe**: the same app with no install.

            Windows may say "Windows protected your PC" because the app isn't signed: click **More info**, then **Run anyway**.

            Built from ${{ github.sha }}.
          files: |
            dist/Maomao-Setup.exe
            dist/Maomao-Portable.exe
