name: Build Maomao

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm version --no-git-tag-version --allow-same-version "0.2.${{ github.run_number }}"
      - run: npx electron-builder --win nsis portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Maomao-windows
          path: |
            dist/Maomao-Setup.exe
            dist/Maomao-Setup.exe.blockmap
            dist/Maomao-Portable.exe
            dist/latest.yml

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm test
      - run: npm version --no-git-tag-version --allow-same-version "0.2.${{ github.run_number }}"
      - run: npx electron-builder --linux AppImage deb rpm --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Maomao-linux
          path: |
            dist/Maomao.AppImage
            dist/maomao.deb
            dist/maomao.rpm
            dist/latest-linux.yml

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Maomao 0.2.${{ github.run_number }}
          make_latest: true
          body: |
            **Windows**
            **Maomao-Setup.exe**: install it (no admin needed). Maomao appears and opens Settings the first time. Paste a Claude API key there to chat with her.
            **Maomao-Portable.exe**: the same app with no install.
            Windows may say "Windows protected your PC" because the app isn't signed: click **More info**, then **Run anyway**.

            **Linux**
            **maomao.deb**: Ubuntu, Debian, Mint, Pop!_OS. `sudo apt install ./maomao.deb`, then open Maomao from your apps.
            **maomao.rpm**: Fedora. `sudo dnf install ./maomao.rpm`, then open Maomao from your apps.
            **Maomao.AppImage**: any distro. `chmod +x Maomao.AppImage && ./Maomao.AppImage`

            Maomao updates herself: she checks every couple of hours, downloads the new version in the background and restarts into it when you step away for a couple of minutes (the portable .exe doesn't update itself).

            Built from ${{ github.sha }}.
          files: |
            dist/Maomao-Setup.exe
            dist/Maomao-Portable.exe
            dist/Maomao.AppImage
            dist/maomao.deb
            dist/maomao.rpm
            dist/Maomao-Setup.exe.blockmap
            dist/latest.yml
            dist/latest-linux.yml
