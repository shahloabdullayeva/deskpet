<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'">
<title>Settings</title>
<link rel="stylesheet" href="settings.css">
</head>
<body>
  <header>
    <img src="icon.png" alt="">
    <div><b>Settings</b><span id="sub">Set up your desk companion</span></div>
    <button id="close" title="Close">✕</button>
  </header>
  <main>
    <section>
      <h2>About you</h2>
      <label for="name">Your name</label>
      <input id="name" type="text" placeholder="What should she call you?">
      <div class="two">
        <div><label for="petName">Her name</label><input id="petName" type="text"></div>
        <div>
          <label for="character">Look</label>
          <select id="character"><option value="maomao">Maomao</option><option value="catgirl">Cat-girl</option></select>
        </div>
      </div>
      <div class="two">
        <div>
          <label for="size">Size</label>
          <select id="size"><option value="small">Small</option><option value="medium">Medium</option><option value="large">Large</option></select>
        </div>
      </div>
      <p class="hint">You can also scroll on her to make her bigger or smaller.</p>
    </section>

    <section>
      <h2>Chat</h2>
      <label for="anthropicKey">Claude API key</label>
      <input id="anthropicKey" type="password" placeholder="sk-ant-…" autocomplete="off">
      <p class="hint">Lets you chat with her, and lets her remember things and set reminders. Get one at console.anthropic.com. It stays on this computer.</p>
      <label for="talksLike">She texts like (optional)</label>
      <input id="talksLike" type="text" placeholder="Someone's name, if she should text like them">
      <label for="style">How she should talk (optional)</label>
      <textarea id="style" rows="3" placeholder="mostly lowercase, short messages, teases a little"></textarea>
    </section>

    <section>
      <h2>Work day</h2>
      <div class="two">
        <div><label for="start">Starts</label><input id="start" type="time"></div>
        <div><label for="end">Ends</label><input id="end" type="time"></div>
      </div>
      <label>Days</label>
      <div id="days" class="days"></div>
      <label>Check-ins</label>
      <div id="checkins"></div>
      <label for="timezone">Time zone</label>
      <input id="timezone" type="text">
    </section>

    <section>
      <h2>Behaviour</h2>
      <label class="check"><input id="sound" type="checkbox"> Chime when a message pops up</label>
      <label class="check"><input id="wander" type="checkbox"> Let her walk around</label>
      <label for="chatterMinutes">Casual messages</label>
      <select id="chatterMinutes">
        <option value="0">Off</option>
        <option value="90">Now and then (about every 1.5 hours)</option>
        <option value="45">Sometimes (about every 45 minutes)</option>
        <option value="20">Often (about every 20 minutes)</option>
      </select>
    </section>

  </main>
  <footer>
    <span id="saved"></span>
    <button id="cancel">Cancel</button>
    <button id="save" class="primary">Save</button>
  </footer>
  <script src="settings.js"></script>
</body>
</html>
