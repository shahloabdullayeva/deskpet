<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: maomao:; style-src 'self'">
<title>Chat</title>
<link rel="stylesheet" href="chat.css">
</head>
<body>
  <header>
    <img src="icon.png" alt="">
    <div class="who">
      <b id="name">Maomao</b>
      <span id="status">online</span>
    </div>
    <button class="tab" data-panel="memories" title="What she remembers about you">Memories</button>
    <button class="tab" data-panel="reminders" title="Your upcoming reminders">Reminders</button>
    <button id="close" title="Close">✕</button>
  </header>
  <p id="note" hidden></p>
  <section id="panel" hidden>
    <div class="panel-head"><b id="panel-title"></b><button id="panel-close">Back to chat</button></div>
    <ul id="panel-list"></ul>
    <p id="panel-empty" class="empty"></p>
  </section>
  <main id="log"></main>
  <div id="typing" hidden><span></span><span></span><span></span></div>
  <div id="emojis" hidden></div>
  <div id="pending" hidden></div>
  <div id="drop" hidden>Drop to send</div>
  <form id="form">
    <input id="pick" type="file" multiple hidden>
    <button id="attach" type="button" title="Send a file or picture">📎</button>
    <button id="emoji" type="button" title="Emoji">🙂</button>
    <textarea id="input" rows="1" placeholder="Message…" autofocus></textarea>
    <button id="send" type="submit" title="Send">➤</button>
  </form>
  <script src="chat.js"></script>
</body>
</html>
